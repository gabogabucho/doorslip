name: publish

on:
  release:
    types: [published]

# Trusted publishing: PyPI accepts the upload because GitHub vouches for the
# workflow that built it, and no token exists anywhere to leak. It also
# produces an attestation linking the package to this repository and commit —
# which is the difference between "a wheel from some domain" and something a
# cautious agent, or person, can actually check the provenance of.
#
# Configure it once at https://pypi.org/manage/account/publishing/ with:
#   owner: gabogabucho   repository: doorslip
#   workflow: publish.yml   environment: pypi

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: tests
        run: |
          uv sync --extra dev
          uv run pytest -q
          uv run python demo.py

      - name: build
        run: uv build

      - name: check
        run: |
          uv run --with twine twine check dist/*
          if tar -tzf dist/*.tar.gz | grep -iE 'key\.json|\.db$|tmp-|outbox'; then
            echo "the archive contains something it should not" >&2
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: publish to PyPI
        run: uv publish --trusted-publishing always
