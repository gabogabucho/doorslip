name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is here because this project keeps finding platform bugs there
    # rather than in spite of it: line endings in shebangs, chmod that cannot
    # express owner-only, a console codepage that mangles UTF-8. All of those
    # reached a real machine before anybody noticed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: install
        run: uv sync --extra dev --python ${{ matrix.python }}

      # The proxy test is the only check that can catch a reverse proxy
      # rewriting request targets, which is the failure doorslip-auth-v1
      # accepts in exchange for having no canonicalisation. It skips itself
      # when Caddy is absent, so without this step it ran only where somebody
      # happened to have Caddy installed - which is a test that stops running.
      - name: caddy
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz"             | sudo tar -xz -C /usr/local/bin caddy
          caddy version

      - name: tests
        # -rs so a skip is visible in the log rather than a dot. A proxy test
        # that quietly stops running is worse than one that fails.
        run: uv run pytest -q -rs

  demo:
    # The suite proves the pieces; this proves they add up. It runs the whole
    # done-criterion of the spec - two identities, an invitation, an eight-turn
    # thread, both sides reconstructing the same state - and exits non-zero if
    # any of it stops holding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run python demo.py

  package:
    # A version on PyPI can never be replaced, so a broken description is
    # permanent for that release. Checking on every push means the answer is
    # already known on the day of a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv run --with twine twine check dist/*
      - name: nothing private in the archive
        run: |
          if tar -tzf dist/*.tar.gz | grep -iE 'key\.json|\.db$|tmp-|outbox'; then
            echo "the archive contains something it should not" >&2
            exit 1
          fi
