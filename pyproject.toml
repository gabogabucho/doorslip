[project]
name = "doorslip"
version = "0.1.0"
description = "Signed mailboxes for personal agents"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.141.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorslip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
