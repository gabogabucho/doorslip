[project]
name = "doorslip"
version = "0.20.0"
description = "Signed mailboxes for personal agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["agents", "protocol", "messaging", "ed25519", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
doorslip = "doorslip.cli:main"
doorslip-mcp = "doorslip.mcp_server:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorslip"]

[tool.hatch.build.targets.sdist]
# Our internal design documents are marked "no publicable" in their own
# header and are written in Spanish for us, not for whoever installs this.
# The public artefacts are README.md and SKILL.md.
exclude = ["arquitectura-*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
